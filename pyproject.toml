[project]
name = "wan-flash"
version = "0.1.0"
description = "Greenfield CuTeDSL flash attention specialized for Wan2.1 training on H100"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12,<2.13",
    "nvidia-cutlass-dsl>=4.6.0.dev0",
]

[tool.setuptools]
packages = ["wan_flash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
